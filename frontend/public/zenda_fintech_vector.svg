<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="zendaFintechTitle zendaFintechDesc">
<title id="zendaFintechTitle">Zenda financial app</title>
<desc id="zendaFintechDesc">Zenda mobile dashboard with balance, income, expenses, savings, budget, goals, wallet and payment card on a dark navy and purple background.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05052B"/><stop offset=".55" stop-color="#0B0B55"/><stop offset="1" stop-color="#16085C"/></linearGradient>
 <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3534C9"/><stop offset=".55" stop-color="#5B5AD6"/><stop offset="1" stop-color="#6D4CFF"/></linearGradient>
 <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4DB83D"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#15165F"/><stop offset="1" stop-color="#08082D"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-opacity=".45"/></filter>
</defs>
<rect width="1200" height="1600" fill="url(#bg)"/>
<circle cx="600" cy="700" r="480" fill="#3325A8" opacity=".16"/>
<!-- analytics -->
<g filter="url(#s)"><rect x="105" y="300" width="235" height="235" rx="34" fill="#15145A" stroke="#6D4CFF" stroke-opacity=".5"/>
<rect x="155" y="365" width="34" height="95" rx="8" fill="url(#p)"/><rect x="207" y="330" width="34" height="130" rx="8" fill="url(#p)"/><rect x="259" y="280" width="34" height="180" rx="8" fill="url(#g)"/>
<path d="M145 478C190 435 220 445 250 400S300 365 315 330" fill="none" stroke="#2FE0A0" stroke-width="8" stroke-linecap="round"/><path d="m306 330 28-4-10 26" fill="#2FE0A0"/></g>
<!-- target -->
<g filter="url(#s)"><circle cx="1000" cy="320" r="105" fill="#15145A" stroke="#6D4CFF" stroke-opacity=".5"/><circle cx="1000" cy="320" r="66" fill="none" stroke="#8B5CF6" stroke-width="18"/><circle cx="1000" cy="320" r="36" fill="none" stroke="#38BDF8" stroke-width="14"/><circle cx="1000" cy="320" r="11" fill="#27E6A1"/><path d="m1060 260 60-60" stroke="#27E6A1" stroke-width="14" stroke-linecap="round"/><path d="m1120 200-5 43-38-5" fill="#27E6A1"/></g>
<!-- budget -->
<g filter="url(#s)"><rect x="70" y="690" width="285" height="330" rx="34" fill="#111151" stroke="#6D4CFF" stroke-opacity=".5"/><text x="105" y="755" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">Budget</text><circle cx="212" cy="850" r="82" fill="none" stroke="#28286E" stroke-width="24"/><path d="M212 768A82 82 0 1 1 139 886" fill="none" stroke="#2FE0A0" stroke-width="24" stroke-linecap="round"/><text x="212" y="855" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="800">72%</text><text x="212" y="890" text-anchor="middle" fill="#A8A8D5" font-family="Arial,sans-serif" font-size="18">of limit</text></g>
<!-- goals -->
<g filter="url(#s)"><rect x="865" y="610" width="275" height="275" rx="34" fill="#111151" stroke="#6D4CFF" stroke-opacity=".5"/><text x="900" y="675" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="700">Goals</text><text x="900" y="725" fill="#A8A8D5" font-family="Arial,sans-serif" font-size="20">3 Active</text><path d="M900 820C935 780 960 800 990 755S1040 770 1085 705" fill="none" stroke="#8B5CF6" stroke-width="8" stroke-linecap="round"/></g>
<!-- phone -->
<g filter="url(#s)"><rect x="370" y="185" width="460" height="990" rx="72" fill="#070719" stroke="#7676D8" stroke-opacity=".65" stroke-width="5"/><rect x="405" y="250" width="390" height="860" rx="58" fill="url(#screen)"/><rect x="515" y="214" width="170" height="38" rx="19" fill="#05050E"/></g>
<g><text x="445" y="325" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">Zenda</text><circle cx="745" cy="314" r="7" fill="#27E6A1"/>
<rect x="435" y="355" width="330" height="170" rx="28" fill="url(#p)"/><text x="465" y="405" fill="#D8D8FF" font-family="Arial,sans-serif" font-size="18">Total Balance</text><text x="465" y="457" fill="white" font-family="Arial,sans-serif" font-size="38" font-weight="800">25,450.00 Kz</text><text x="465" y="490" fill="#2FE0A0" font-family="Arial,sans-serif" font-size="17" font-weight="700">↑ 8.5% this month</text>
<text x="445" y="575" fill="white" font-family="Arial,sans-serif" font-size="24" font-weight="700">Overview</text><rect x="435" y="600" width="330" height="215" rx="25" fill="#10104A" stroke="#39398B" stroke-width="2"/>
<circle cx="470" cy="650" r="16" fill="#2FE0A0"/><text x="500" y="657" fill="white" font-family="Arial,sans-serif" font-size="18">Income</text><text x="735" y="657" text-anchor="end" fill="#2FE0A0" font-family="Arial,sans-serif" font-size="17">42,000.00 Kz</text>
<circle cx="470" cy="710" r="16" fill="#EC4899"/><text x="500" y="717" fill="white" font-family="Arial,sans-serif" font-size="18">Expenses</text><text x="735" y="717" text-anchor="end" fill="#FF6B9E" font-family="Arial,sans-serif" font-size="17">16,550.00 Kz</text>
<circle cx="470" cy="770" r="16" fill="#38BDF8"/><text x="500" y="777" fill="white" font-family="Arial,sans-serif" font-size="18">Savings</text><text x="735" y="777" text-anchor="end" fill="#38BDF8" font-family="Arial,sans-serif" font-size="17">8,900.00 Kz</text>
<rect x="435" y="845" width="330" height="190" rx="25" fill="#10104A"/><text x="460" y="885" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="700">Categories</text><circle cx="515" cy="955" r="50" fill="none" stroke="#25256D" stroke-width="18"/><path d="M515 905A50 50 0 0 1 560 932" fill="none" stroke="#6D4CFF" stroke-width="18"/><path d="M560 932A50 50 0 0 1 540 997" fill="none" stroke="#38BDF8" stroke-width="18"/><text x="515" y="963" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="700">65%</text>
<text x="600" y="930" fill="#CFCFFF" font-family="Arial,sans-serif" font-size="15">Housing 40%</text><text x="600" y="957" fill="#CFCFFF" font-family="Arial,sans-serif" font-size="15">Food 25%</text><text x="600" y="984" fill="#CFCFFF" font-family="Arial,sans-serif" font-size="15">Transport 20%</text><text x="600" y="1011" fill="#CFCFFF" font-family="Arial,sans-serif" font-size="15">Others 15%</text></g>
<!-- wallet -->
<g filter="url(#s)"><path d="M180 1250Q170 1215 205 1195l160-80q30-15 50 15l65 135q12 30-18 45l-217 65q-40 10-55-25z" fill="#19156B" stroke="#6D4CFF" stroke-width="3"/><rect x="300" y="1255" width="135" height="68" rx="25" fill="#211D7B" stroke="#8B5CF6" stroke-width="3"/><circle cx="405" cy="1289" r="10" fill="#D7D2FF"/><circle cx="250" cy="1370" r="38" fill="#F4B740"/><text x="250" y="1382" text-anchor="middle" fill="#5D3B00" font-family="Arial" font-size="27" font-weight="800">$</text></g>
<!-- card -->
<g filter="url(#s)" transform="rotate(10 1000 1300)"><rect x="865" y="1190" width="300" height="185" rx="28" fill="url(#p)" stroke="#8B5CF6" stroke-width="3"/><rect x="900" y="1240" width="48" height="36" rx="7" fill="#F2C94C"/><text x="900" y="1330" fill="#E8E8FF" font-family="Arial,sans-serif" font-size="18">ZENDA</text></g>
<!-- platform --> <ellipse cx="600" cy="1450" rx="470" ry="85" fill="#16105D" opacity=".85"/><ellipse cx="600" cy="1435" rx="430" ry="45" fill="#6D4CFF" opacity=".2"/>
</svg>
